# CI/CD da infraestrutura:
#   - Pull request: fmt, validate e plan (o plano aparece no resumo da execução)
#   - Merge na main: apply automático
# Secrets necessários no repositório: AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY

name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Formatação
        id: fmt
        continue-on-error: true
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Outputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
