apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-execution
  namespace: oficina
spec:
  serviceName: postgres-execution
  replicas: 1
  selector:
    matchLabels:
      app: postgres-execution
  template:
    metadata:
      labels:
        app: postgres-execution
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: oficina_execution
            - name: POSTGRES_USER
              value: execution_service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-execution-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "execution_service", "-d", "oficina_execution"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-execution
  namespace: oficina
spec:
  clusterIP: None
  selector:
    app: postgres-execution
  ports:
    - port: 5432
      targetPort: 5432
